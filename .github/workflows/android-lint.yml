name: TerminAI Android Lint

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "runtime/**"
      - ".github/workflows/android-lint.yml"
  pull_request:
    branches:
      - main
    paths:
      - "android/**"
      - "runtime/**"
      - ".github/workflows/android-lint.yml"

permissions:
  contents: read

concurrency:
  group: android-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Compile & Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "${SDK_ROOT}/cmdline-tools/latest/bin" >> "${GITHUB_PATH}"
          echo "${SDK_ROOT}/platform-tools" >> "${GITHUB_PATH}"
          "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --version
          set +o pipefail
          yes | "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/gradle-wrapper.properties', 'android/**/*.gradle', 'android/gradle.properties') }}

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x gradlew

      - name: Run Android compile gate
        working-directory: android
        run: ./gradlew clean compileDebugKotlin --no-daemon --stacktrace --no-build-cache --info

      - name: Run Android lint
        working-directory: android
        run: ./gradlew lintDebug --no-daemon --stacktrace --no-build-cache

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-reports
          path: android/app/build/reports/lint-results*
          if-no-files-found: ignore
