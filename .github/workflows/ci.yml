name: TerminAI Web CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ci.yml"
      - "package.json"
      - "package-lock.json"
      - "postcss.config.js"
      - "tailwind.config.js"
      - "tsconfig.json"
      - "vite.config.ts"
      - "index.html"
      - "server.ts"
      - "src/**"
      - "runtime/**"
      - "scripts/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: terminai-web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Type-check, runtime checks, and web/server build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Show environment versions
        shell: bash
        run: |
          set -euxo pipefail
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          ls -la runtime/ || true

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Validate runtime manifests
        run: npm run runtime:validate

      - name: Run automated tests
        run: npm test

      - name: Runtime manifest status
        run: npm run runtime:status

      - name: Build web client and production server
        run: npm run build

      - name: Build runtime bundle lock
        run: npm run runtime:bundle

      - name: Cleanup stale processes and ports
        shell: bash
        run: |
          set -euxo pipefail
          pkill -f "node.*vite" 2>/dev/null || true
          pkill -f "node.*dev" 2>/dev/null || true
          pkill -f "node.*dist/server" 2>/dev/null || true
          pkill -f "chromium" 2>/dev/null || true
          pkill -f "chrome" 2>/dev/null || true
          for port in 3099 32025 32026 32027 32100 32200 32300 32400 24678 24679 24680; do
            if lsof -ti:${port} >/dev/null 2>&1; then
              lsof -ti:${port} | xargs kill -9 2>/dev/null || true
            fi
          done
          sleep 2

      - name: Smoke-test production server and run API safety checks
        shell: bash
        run: |
          set -euxo pipefail
          SMOKE_PORT=3099 NODE_ENV=production TERMINAI_COMMAND_TIMEOUT_MS=100 npm run start > server.log 2>&1 &
          SERVER_PID=$!
          SMOKE_PORT=3099 NODE_ENV=production TERMINAI_COMMAND_TIMEOUT_MS=100 npm run smoke:runtime
          kill ${SERVER_PID} 2>/dev/null || true

      - name: Upload production server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminai-web-server-logs
          path: server.log
          if-no-files-found: ignore

      - name: Upload web/server build artifact
        uses: actions/upload-artifact@v4
        with:
          name: terminai-web-dist
          path: dist/
          if-no-files-found: error
