name: Build Hermes ARM64 Venv Artifact

on:
  workflow_dispatch:
    inputs:
      hermes_path:
        description: "Path or URL to the Hermes runtime artifacts to package"
        required: false
        default: ""
      include_tests:
        description: "Include test/dev artifacts for debugging only"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-hermes-venv:
    name: Build ARM64 Hermes venv
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU/ARM64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Prepare Hermes artifact input
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/hermes-input
          if [ -n "${{ inputs.hermes_path }}" ]; then
            if [[ "${{ inputs.hermes_path }}" == http* ]]; then
              curl -L "${{ inputs.hermes_path }}" -o build/hermes-input/hermes-archive
              case "${{ inputs.hermes_path }}" in
                *.zip) unzip -q build/hermes-input/hermes-archive -d build/hermes-input ;;
                *.tar.gz|*.tgz) tar -xzf build/hermes-input/hermes-archive -C build/hermes-input ;;
              esac
            else
              cp -R "${{ inputs.hermes_path }}"/* build/hermes-input/ || true
            fi
          fi
          ls -la build/hermes-input

      - name: Build ARM64 venv inside container
        id: build_venv
        shell: bash
        env:
          HERMES_VENV_DIR: runtime/assets/bin/hermes-venv
          HERMES_INPUT_DIR: build/hermes-input
        run: |
          set -euxo pipefail
          mkdir -p "${HERMES_VENV_DIR}"
          docker run --rm --platform linux/arm64 \
            -u "$(id -u):$(id -g)" \
            -v "$PWD:/repo" \
            -w /repo \
            -e HERMES_INPUT_DIR="/repo/${HERMES_INPUT_DIR}" \
            -e HERMES_VENV_DIR="/repo/${HERMES_VENV_DIR}" \
            arm64v8/python:3.11-slim bash -lc '
              set -euo pipefail
              HERMES_INPUT_DIR="${HERMES_INPUT_DIR:-}"
              HERMES_VENV_DIR="${HERMES_VENV_DIR:-runtime/assets/bin/hermes-venv}"
              mkdir -p "${HERMES_VENV_DIR}"
              echo "=== QEMU/ARCH CHECK ==="
              uname -m
              echo "=== PYTHON VERSION ==="
              python --version
              echo "=== CREATE VENV ==="
              python -m venv --copies "${HERMES_VENV_DIR}"
              source "${HERMES_VENV_DIR}/bin/activate"
              echo "=== UPGRADE PIP TOOLING ==="
              python -m pip install --upgrade pip setuptools wheel
              install_input=false
              if [ -n "${HERMES_INPUT_DIR}" ] && [ -d "${HERMES_INPUT_DIR}" ]; then
                if [ -f "${HERMES_INPUT_DIR}/requirements.txt" ] || [ -d "${HERMES_INPUT_DIR}/dist" ] || [ -f "${HERMES_INPUT_DIR}/pyproject.toml" ] || [ -f "${HERMES_INPUT_DIR}/setup.py" ]; then
                  install_input=true
                fi
              fi
              if [ "${install_input}" = true ]; then
                if [ -f "${HERMES_INPUT_DIR}/requirements.txt" ]; then
                  echo "=== INSTALL REQUIREMENTS ==="
                  pip install -v -r "${HERMES_INPUT_DIR}/requirements.txt" 2>&1 | tee -a /repo/pip-install.log
                fi
                if [ -d "${HERMES_INPUT_DIR}/dist" ]; then
                  echo "=== INSTALL WHEELS ==="
                  pip install -v "${HERMES_INPUT_DIR}/dist"/*.whl 2>&1 | tee -a /repo/pip-install.log
                fi
                if [ -f "${HERMES_INPUT_DIR}/pyproject.toml" ] || [ -f "${HERMES_INPUT_DIR}/setup.py" ]; then
                  echo "=== INSTALL INPUT DIR ==="
                  pip install -v "${HERMES_INPUT_DIR}" 2>&1 | tee -a /repo/pip-install.log
                fi
              else
                echo "=== INSTALL hermes-agent FROM PYPI ==="
                pip install -v hermes-agent 2>&1 | tee -a /repo/pip-install.log
              fi
              echo "=== PIP SHOW hermes-agent ==="
              pip show hermes-agent || {
                echo "hermes-agent is not installed after pip install" >&2
                exit 1
              }
              echo "=== PIP LIST ==="
              pip list | sed -n "1,220p"
              echo "=== VENV PYTHON CHECK ==="
              "${HERMES_VENV_DIR}/bin/python" --version
              "${HERMES_VENV_DIR}/bin/python" -c "import platform; print(\"MACHINE:\", platform.machine())"
              if [ ! -f "${HERMES_VENV_DIR}/bin/hermes" ]; then
                echo "Missing Hermes CLI entrypoint: ${HERMES_VENV_DIR}/bin/hermes" >&2
                exit 1
              fi
              if ! "${HERMES_VENV_DIR}/bin/hermes" --help > /tmp/hermes-help.txt; then
                echo "hermes --help failed in ARM64 venv" >&2
                cat /tmp/hermes-help.txt || true
                exit 1
              fi
              if [ ! -s /tmp/hermes-help.txt ]; then
                echo "hermes --help produced no output" >&2
                exit 1
              fi
              cat /tmp/hermes-help.txt
              echo "=== VENV FILE TREE ==="
              find "${HERMES_VENV_DIR}" -maxdepth 3 -type f | sort
            '
          venv_files="$(find "${HERMES_VENV_DIR}" -maxdepth 3 -type f | wc -l)"
          if [ "${venv_files}" -eq 0 ]; then
            echo "Built Hermes venv contains no files at ${HERMES_VENV_DIR}" >&2
            exit 1
          fi
          echo "venv_file_count=${venv_files}" >> "$GITHUB_OUTPUT"
          echo "HERMES_VENV_DIR=${HERMES_VENV_DIR}" >> "$GITHUB_OUTPUT"

      - name: Upload pip install log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-pip-install-log
          path: pip-install.log
          if-no-files-found: warn
          retention-days: 14

      - name: Verify Hermes venv contents
        shell: bash
        env:
          HERMES_VENV_DIR: ${{ steps.build_venv.outputs.HERMES_VENV_DIR || 'runtime/assets/bin/hermes-venv' }}
        run: |
          set -euxo pipefail
          HERMES_VENV_DIR="runtime/assets/bin/hermes-venv"
          test -d "${HERMES_VENV_DIR}"
          test -x "${HERMES_VENV_DIR}/bin/python3" || test -x "${HERMES_VENV_DIR}/bin/python"
          test -x "${HERMES_VENV_DIR}/bin/hermes"

      - name: Record venv size in job summary
        id: venv_summary
        shell: bash
        env:
          HERMES_VENV_DIR: ${{ steps.build_venv.outputs.HERMES_VENV_DIR || 'runtime/assets/bin/hermes-venv' }}
        run: |
          set -euxo pipefail
          size="$(du -sh "${HERMES_VENV_DIR}" | cut -f1 || echo unknown)"
          echo "hermes-venv-size: ${size}" >> "$GITHUB_STEP_SUMMARY"
          echo "Hermes venv size: ${size}"

      - name: Upload Hermes venv artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-arm64-venv
          path: ${{ steps.build_venv.outputs.HERMES_VENV_DIR || 'runtime/assets/bin/hermes-venv' }}/
          if-no-files-found: error
          retention-days: 14

      - name: Upload venv size report
        uses: actions/upload-artifact@v4
        with:
          name: hermes-venv-size-report
          path: venv-size.txt
          if-no-files-found: warn
          retention-days: 14
