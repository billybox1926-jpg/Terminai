name: TerminAI Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: terminai-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-web:
    name: Build web/server artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run automated tests
        run: npm test

      - name: Build web client and production server
        run: npm run build

      - name: Build runtime bundle lock
        run: npm run runtime:bundle

      - name: Smoke-test production server
        shell: bash
        run: |
          set -euxo pipefail
          PORT=3099 npm run start > server.log 2>&1 &
          sleep 2
          if ! curl -fsS "http://127.0.0.1:3099/" >/dev/null; then
            echo "Server did not become reachable after startup."
            echo "## server.log" >> "${GITHUB_STEP_SUMMARY}"
            [ -f server.log ] && cat server.log >> "${GITHUB_STEP_SUMMARY}" || echo "server.log not found"
            exit 1
          fi
          curl -fsS "http://127.0.0.1:3099/" >/dev/null
          curl -fsS "http://127.0.0.1:3099/api/runtime/status" >/dev/null

      - name: Run command and file API safety smoke tests
        run: npm run security:smoke

      - name: Upload web dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: terminai-web-dist
          path: dist/
          if-no-files-found: error

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terminai-web-server-logs
          path: server.log
          if-no-files-found: ignore

  build-android:
    name: Build Android artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "${SDK_ROOT}/cmdline-tools/latest/bin" >> "${GITHUB_PATH}"
          echo "${SDK_ROOT}/platform-tools" >> "${GITHUB_PATH}"
          "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --version
          set +o pipefail
          yes | "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x gradlew

      - name: Clear Gradle caches for clean build
        shell: bash
        run: rm -rf ~/.gradle/caches/ ~/.gradle/wrapper/

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace --info

      - name: Build unsigned release APK
        working-directory: android
        env:
          TERMINAI_API_KEY: ${{ secrets.TERMINAI_API_KEY || 'ci-dummy-key' }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace --info

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: terminai-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: terminai-android-release-unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: android/app/build/reports/
          if-no-files-found: ignore

  package-release:
    name: Package versioned release artifacts
    needs: [build-web, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: terminai-web-dist
          path: download/web-dist

      - name: Download Android debug artifact
        uses: actions/download-artifact@v4
        with:
          name: terminai-android-debug-apk
          path: download/android-debug

      - name: Download Android release artifact
        uses: actions/download-artifact@v4
        with:
          name: terminai-android-release-unsigned-apk
          path: download/android-release

      - name: Package versioned artifacts
        shell: bash
        run: |
          set -euxo pipefail
          VERSION_TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            VERSION_TAG="manual-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          fi
          mkdir -p release-artifacts
          cp -f download/web-dist/* release-artifacts/terminai-web-dist-${VERSION_TAG}.tar.gz 2>/dev/null || true
          if [ -f download/android-debug/app-debug.apk ]; then
            cp download/android-debug/app-debug.apk "release-artifacts/terminai-android-debug-${VERSION_TAG}.apk"
          fi
          if [ -f download/android-release/app-release-unsigned.apk ]; then
            cp download/android-release/app-release-unsigned.apk "release-artifacts/terminai-android-release-unsigned-${VERSION_TAG}.apk"
          fi
          (
            cd release-artifacts
            sha256sum * > "terminai-${VERSION_TAG}-sha256sums.txt" 2>/dev/null || true
          )

      - name: Upload release package artifact
        uses: actions/upload-artifact@v4
        with:
          name: terminai-release-${{ env.TERMINAI_RELEASE_VERSION || 'manual' }}
          path: release-artifacts/
          if-no-files-found: warn

      - name: Create GitHub Release for tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          gh release create "${GITHUB_REF_NAME}" release-artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "TerminAI ${GITHUB_REF_NAME}" \
            --generate-notes || true
