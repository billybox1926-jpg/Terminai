# Project-wide Gradle settings for TerminAI.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Disable Kotlin build metrics to fix BuildFlowService isolation issues
kotlin.metrics.enabled=false

# Disable build cache for CI environments
org.gradle.caching=false

# TerminAI package identity
# One app: com.billybox.terminai
# Not com.termux. Not WebTermux. Not AI Studio.