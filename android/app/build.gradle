apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// Build-time safeguard for API key
def apiKey = project.findProperty("TERMINAI_API_KEY") as String ?: System.getenv("TERMINAI_API_KEY") ?: ""

// Fail fast for release builds if API key is missing
def isReleaseBuild = gradle.startParameter.taskRequests.any { request ->
    (request.args ?: []).any { arg -> arg.toString().toLowerCase().contains("release") || arg.toString().toLowerCase().contains("assemble") }
}
if (isReleaseBuild && apiKey.isEmpty()) {
    throw new GradleException("TERMINAI_API_KEY is required for release builds. Set it in gradle.properties or as an environment variable.")
}

// Conditional release signing: only activates when ALL required
// environment variables are present (set by GitHub Actions secrets).
// Without secrets, the release build remains unsigned (existing behavior).
def keystorePathEnv = System.getenv('TERMINAI_KEYSTORE_PATH')
def keystorePasswordEnv = System.getenv('TERMINAI_ANDROID_KEYSTORE_PASSWORD')
def keystoreAliasEnv = System.getenv('TERMINAI_ANDROID_KEY_ALIAS')
def keystoreKeyPasswordEnv = System.getenv('TERMINAI_ANDROID_KEY_PASSWORD')
def signingReady = keystorePathEnv && keystorePasswordEnv && keystoreAliasEnv && keystoreKeyPasswordEnv

android {
    namespace 'com.billybox.terminai'
    compileSdk 34
    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId 'com.billybox.terminai'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'

        vectorDrawables {
            useSupportLibrary true
        }

        // BuildConfig field for API key (available at runtime)
        buildConfigField "String", "TERMINAI_API_KEY", "\"$apiKey\""
    }

    signingConfigs {
        release {
            if (signingReady) {
                storeFile file(keystorePathEnv)
                storePassword keystorePasswordEnv
                keyAlias keystoreAliasEnv
                keyPassword keystoreKeyPasswordEnv
            }
        }
    }

    buildTypes {
        debug {
            // Allow debug builds to work without API key (with warning)
            if (apiKey.isEmpty()) {
                println "WARNING: TERMINAI_API_KEY is not set. Debug build will run without API key."
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingReady) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = '1.5.14'
    }

    packaging {
        resources {
            excludes += ['/META-INF/AL2.0', '/META-INF/LGPL2.1']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.4'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation platform('androidx.compose:compose-bom:2024.11.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.runtime:runtime-livedata'

    // Network dependencies for API client
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // JSON parsing
    implementation 'com.squareup.moshi:moshi-kotlin:1.15.1'

    // Test dependencies
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.test.runner:androidJUnitRunner'
    androidTestImplementation 'androidx.test.services:test-services:1.5.0'
    androidTestImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
}